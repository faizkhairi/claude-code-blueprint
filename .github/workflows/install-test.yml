# Repository integrity checks.
#
# install-matrix  exercises every preset across fresh / re-run / non-TTY / dry-run /
#                 piped scenarios and asserts the installer never crashes and never
#                 wires a hook it did not install. Catches the set -e / schema-drift /
#                 preset-mismatch bug class.
# hook-tests      smoke-tests every hook script for crashes.
# count-check     asserts every published component count ("12 agents", the card
#                 sources, the three translated READMEs) matches the filesystem.
# required-checks advisory: warns when a CI job is not a required status check, or
#                 when a required check names a job that no longer exists.
name: Install Test

on:
  push:
    branches: [main]
    paths:
      - "setup.sh"
      - "examples/settings-template.json"
      - "tests/**"
      - "hooks/**"
      - ".github/workflows/install-test.yml"
      # count-check reads published counts out of the docs and the card sources,
      # so a direct push touching only those still needs to run it.
      - "**/*.md"
      - "assets/**"
      - "agents/**"
      - "skills/**"
      - "rules/**"
  # Runs on every PR (no path filter) so it can be a required status check:
  # a required check that is skipped on some PRs would block their merge forever.
  # The matrix is self-contained (it installs and tests regardless of the diff).
  pull_request:

permissions:
  contents: read

jobs:
  install-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run installer matrix
        run: bash tests/install-matrix.sh

  hook-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run hook smoke tests
        run: bash hooks/test-hooks.sh

  count-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify published counts against the filesystem
        run: bash tests/count-check.sh

  # Advisory, and deliberately NOT a required status check.
  #
  # Making it required would deadlock: adding it to the ruleset is the act that
  # makes it pass, so until it is added it fails, and while it fails it blocks the
  # PR that would add it. It would also fail on every fork, which has no copy of
  # this repo's branch protection. continue-on-error keeps the signal visible on
  # the PR without letting it gate anything.
  required-checks:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Warn if a CI job is not an enforced required check
        run: bash tests/required-checks.sh
